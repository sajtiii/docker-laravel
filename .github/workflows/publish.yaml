name: Publish

on:
  push:
    branches:
      - 'main'
  release:
    types: [released]
  pull_request:
    branches:
      - 'main'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  build-and-publish:
    name: Build and publish container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Build, scan and publish
        uses: sajtiii/github-actions/docker-build@v1
        with:
          registry: ghcr
          variant: php${{ matrix.php }}
          variant-default: ${{ matrix.php == '8.5' }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64
