name: Publish

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches:
      - 'main'
  release:
    types: [released]
  pull_request:
    branches:
      - 'main'

env:
  REGISTRY: ghcr.io

permissions: {}

jobs:
  build-and-publish:
    name: Build and publish container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.php == '8.5' && github.event_name == 'release' }}

            type=semver,pattern=v{{version}},enable=${{ matrix.php == '8.5' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ matrix.php == '8.5' }}
            type=semver,pattern=v{{major}},enable=${{ matrix.php == '8.5' }}
            type=edge,branch=main,enable=${{ matrix.php == '8.5' }}

            type=raw,value=php${{ matrix.php }},enable=${{ github.event_name == 'release' }}

            type=semver,pattern=v{{version}},suffix=-php${{ matrix.php }}
            type=semver,pattern=v{{major}}.{{minor}},suffix=-php${{ matrix.php }}
            type=semver,pattern=v{{major}},suffix=-php${{ matrix.php }}
            type=edge,branch=main,suffix=-php${{ matrix.php }}
            type=ref,event=pr,suffix=-php${{ matrix.php }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single platform build, only used for scanning. The layers are reused by the final build.
      - name: Build image for scanning
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          load: true
          push: false
          tags: scan:php${{ matrix.php }}
          cache-from: type=gha,scope=php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          platforms: linux/amd64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:php${{ matrix.php }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Prepare Trivy comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          {
            echo "<details>"
            echo "<summary>Trivy scan: PHP ${{ matrix.php }}</summary>"
            echo ""
            echo '```'
            head -c 60000 trivy-report.txt
            echo ""
            echo '```'
            echo "</details>"
          } > trivy-comment.md

      - name: Comment Trivy report on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: trivy-php${{ matrix.php }}
          path: trivy-comment.md

      # Releases are not published while fixable critical vulnerabilities are present
      - name: Gate release on critical vulnerabilities
        if: github.event_name == 'release'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:php${{ matrix.php }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          platforms: linux/386,linux/amd64,linux/arm/v7,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${REGISTRY}/${{ github.repository }}@${{ steps.build.outputs.digest }}"
